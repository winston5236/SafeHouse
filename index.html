<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Home Guardian</title>
<style>

button{cursor:pointer}button.on{border-color:var(--bl);color:var(--bl);background:#e8f0fe}button.del{color:var(--rd)}

#vp>.pop{position:absolute;z-index:6;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 4px 18px rgba(32,33,36,.25)}
#obBtn{position:absolute;z-index:7;left:12px;top:12px;width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 2px 8px rgba(32,33,36,.3)}
#obPop{left:12px;top:62px;width:310px;max-height:calc(100% - 74px);overflow:auto;padding:0 10px 8px}#scPop{right:12px;top:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;padding:0 10px 8px}
.pophd{display:flex;align-items:center;gap:8px;padding:8px 0 4px}.pophd b{flex:1}.pophd button{padding:0 8px}#scInfo{cursor:help;color:var(--mu)}#scPop.min #p-score{display:none}

.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:#eef1f6}.tag.hi{background:#fde7e4;color:var(--rd)}
.dims label{display:flex;flex-direction:column;font-size:11px;color:var(--mu)}.dims input{width:64px}
ul{margin:4px 0;padding-left:18px}

header{background:#202124}aside{background:#f8fafc}

/* ================= AC setup after import: brand, position, automatic size ================= */
const BRANDS=[['Daikin','大金'],['Hitachi','日立'],['Mitsubishi Electric','三菱電機'],['Mitsubishi Heavy Industries','三菱重工'],['Panasonic','國際牌'],['TECO','東元'],['Gree','格力'],['HERAN','禾聯'],['Other / not sure','其他／不確定']],

function roomBox(){const ws=of('wall');if(!ws.length)return null;const xs=[],zs=[];ws.forEach(w=>{const h=w.dim[0]/2;xs.push(w.x-Math.cos(w.rot)*h,w.x+Math.cos(w.rot)*h);zs.push(w.z+Math.sin(w.rot)*h,w.z-Math.sin(w.rot)*h)});return{x0:Math.min(...xs),x1:Math.max(...xs),z0:Math.min(...zs),z1:Math.max(...zs)}}
/* Rule-of-thumb peak load: 100 W per m2 of floor (scaled by ceiling height) + west-window sun at peak + people (130 W each, sensible and latent) + equipment, plus a 10% margin. For planning only. */
function sizeAC(){const b=roomBox();if(!b)return null;const A=(b.x1-b.x0)*(b.z1-b.z0),gl=westWins().reduce((a,w)=>a+w.dim[0]*w.dim[1],0),
 base=A*100*room.ceil/2.5,sol=gl*cool.shgc*Math.max(...IRR),ppl=cool.ppl*130,inl=cool.inl,tot=(base+sol+ppl+inl)*1.1,kw=tot/1000,
 cap=CAPS.find(c=>c>=kw),n=cap?1:Math.ceil(kw/CAPS[CAPS.length-1]),use=cap||CAPS[CAPS.length-1];

function sizeHtml(S){return `<div class="card" style="border-left-color:#3b82f6"><b>${Z('Recommended','建議規格')}: ${r1(S.cap)} kW${S.n>1?` × ${S.n}`:''} · ${r2(S.cap/3.5)} ${Z('ton','噸')} · ${Math.round(S.btu/100)*100} BTU/h</b>
 <div class="mu">${Z('Room','房間')} ${r1(S.A)} m² (${r1(S.ping)} ${Z('ping','坪')}), ${Z('ceiling','天花板')} ${r2(room.ceil)} m. ${Z('Peak load','尖峰負荷')} ${r2(S.kw)} kW (${Z('incl. 10% margin','含 10% 餘裕')}).</div>
 <table class="ct"><tr><td>${Z('Floor and ceiling','房間本身')}</td><td>${Math.round(S.base)} W</td></tr><tr><td>${Z('West window sun (SHGC '+r2(cool.shgc)+')','西曬窗日射（SHGC '+r2(cool.shgc)+'）')}</td><td>${Math.round(S.sol)} W</td></tr><tr><td>${Z('People','人員')} (${cool.ppl})</td><td>${Math.round(S.ppl)} W</td></tr><tr><td>${Z('Equipment','設備')}</td><td>${Math.round(S.inl)} W</td></tr></table>
 ${S.n>1?`<div class="mu">${svg('warn',14)} ${Z('The load is above the largest single unit: plan two units or split the space.','負荷超過單台最大規格：建議規劃兩台或分區。')}</div>`:''}${S.over?`<div class="mu">${Z('The nearest standard size is well above the load; a smaller or inverter model avoids short cycling.','最接近的標準規格明顯大於負荷；選較小或變頻機型可避免頻繁啟停。')}</div>`:''}
 <div class="mu">${Z('Change the shading option or the number of people in Cooling and the size updates. Planning estimate only: ask an installer to confirm, and compare the energy label (CSPF) of each model.','在「降溫」分頁改遮陽方式或人數，規格會隨之更新。僅為規劃估算：請由安裝人員確認，並比較各機型的能源效率標示（CSPF）。')}</div></div>`}
function wallSpot(w,px,pz){const ws=of('wall'),cx=ws.reduce((a,q)=>a+q.x,0)/ws.length,cz=ws.reduce((a,q)=>a+q.z,0)/ws.length,dx=Math.cos(w.rot),dz=-Math.sin(w.rot);let nx=Math.sin(w.rot),nz=Math.cos(w.rot);if((cx-w.x)*nx+(cz-w.z)*nz<0){nx=-nx;nz=-nz}
 const lim=Math.max(0,w.dim[0]/2-.45),s=Math.max(-lim,Math.min(lim,px==null?0:(px-w.x)*dx+(pz-w.z)*dz)),x=w.x+dx*s+nx*.15,z=w.z+dz*s+nz*.15,rot=Math.atan2(nx,nz),S=items.filter(i=>['chair','sofa','bed'].includes(i.type)),
